name: drivervault
description: DriverVault
publish_to: 'none'
version: 2.1.0+22
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/games/
    - assets/catalog/
    - assets/vehicles/fh5/
    - assets/vehicles/beamng/
    - assets/vehicles/ets2/
    - assets/vehicles/ats/
    - assets/vehicles/assetto/
    - assets/vehicles/wrc/
    - assets/vehicles/alaskan/
    - assets/vehicles/mudrunner/
    - assets/vehicles/snowrunner/
    - assets/vehicles/gt7/
    - assets/vehicles/carx/
    - assets/vehicles/crew/
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/drivervault_icon.png
  adaptive_icon_background: "#07060B"
  adaptive_icon_foreground: assets/branding/drivervault_icon.png
