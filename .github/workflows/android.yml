name: Build DriverVault v2.0 APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'DriverVault-source-v2.0-fix3.zip'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract v2.0
        run: |
          set -euo pipefail
          rm -rf build-project && mkdir build-project
          unzip -q DriverVault-source-v2.0-fix3.zip -d build-project
          test -f build-project/lib/main.dart
      - name: Deep-map and verify vehicle imagery
        working-directory: build-project
        timeout-minutes: 60
        run: |
          set -euo pipefail
          python3 scripts/map_game_images.py | tee image-validation.txt
          python3 - <<'PY'
          import json
          c=json.load(open('assets/catalog/catalog.json'))
          for g in c['games']:
              n=len(g.get('vehicles',[])); imgs=sum(bool(str(v.get('image','')).strip()) for v in g.get('vehicles',[]))
              if n: print(f"{g['id']:12} {imgs:4}/{n:4} images")
          fh=next(g for g in c['games'] if g['id']=='fh5')
          assert len(fh['vehicles'])==902
          assert sum(bool(v.get('image')) for v in fh['vehicles'])>=805
          for gid in ('carx','beamng','ets2','ats','assetto','wrc','alaskan','mudrunner','snowrunner','gt7'):
              g=next(x for x in c['games'] if x['id']==gid)
              assert any(str(v.get('image','')).strip() for v in g['vehicles']), f'{gid}: ZERO images'
          code=open('lib/main.dart').read()
          assert "existing:Map<String,dynamic>.from(s)" in code
          assert "indexWhere((x)=>x['id']==s['id'])" in code
          PY
      - name: Preserve mapping checkpoint
        if: always()
        run: |
          if [ -d build-project ]; then
            cd build-project
            zip -qr ../DriverVault-v2.0-mapping-checkpoint.zip . -x 'build/*' '.dart_tool/*' '.git/*'
          fi
      - name: Upload mapping checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DriverVault-v2.0-mapping-checkpoint
          path: DriverVault-v2.0-mapping-checkpoint.zip
          if-no-files-found: ignore
      - name: Preserve image-mapping checkpoint
        if: always()
        run: |
          if [ -d build-project ]; then
            cd build-project
            zip -qr ../DriverVault-v2.0-fix3-checkpoint.zip . -x 'build/*' '.dart_tool/*' '.git/*'
          fi
      - name: Upload mapping checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DriverVault-v2.0-fix3-checkpoint
          path: DriverVault-v2.0-fix3-checkpoint.zip
          if-no-files-found: ignore
      - name: Prepare Flutter project
        working-directory: build-project
        run: |
          flutter create . --platforms=android,ios --org com.drivervault.app
          rm -f test/widget_test.dart
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/AndroidManifest.xml');x=p.read_text()
          x=re.sub(r'android:label="[^"]*"','android:label="DriverVault"',x,count=1)
          if 'android.permission.INTERNET' not in x:x=x.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">','<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>')
          p.write_text(x)
          PY
          flutter pub get
          dart run flutter_launcher_icons
      - name: Analyze
        working-directory: build-project
        run: flutter analyze --no-fatal-infos
      - name: Build APK
        working-directory: build-project
        run: flutter build apk --debug
      - name: Package enriched source
        run: |
          cd build-project
          zip -qr ../DriverVault-source-v2.0-enriched.zip . -x 'build/*' '.dart_tool/*' '.git/*'
      - name: Upload APK and validation
        uses: actions/upload-artifact@v4
        with:
          name: DriverVault-v2.0-verified
          path: |
            build-project/build/app/outputs/flutter-apk/app-debug.apk
            build-project/image-validation.txt
            DriverVault-source-v2.0-enriched.zip
