name: Extract DriverVault Source

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/android.yml'

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract DriverVault v1.8
        run: |
          set -euo pipefail

          test -f DriverVault-source-v1.8.zip || {
            echo "ERROR: DriverVault-source-v1.8.zip not found"
            exit 1
          }

          rm -rf extracted
          mkdir extracted

          unzip -q DriverVault-source-v1.8.zip -d extracted

          echo "Checking extracted source..."
          test -f extracted/lib/main.dart
          test -f extracted/assets/catalog/catalog.json
          test -f extracted/assets/catalog/hardware.json
          test -f extracted/assets/catalog/game_schemas.json

          echo "Source successfully extracted."

      - name: Upload editable DriverVault source
        uses: actions/upload-artifact@v4
        with:
          name: DriverVault-v1.8-editable-source
          path: extracted/
          retention-days: 7
