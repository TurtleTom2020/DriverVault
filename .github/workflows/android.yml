name: DriverVault Android CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate DriverVault data
        run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          cat=json.load(open(root/'assets/catalog/catalog.json',encoding='utf-8'))
          schemas=json.load(open(root/'assets/catalog/game_schemas.json',encoding='utf-8'))
          hw=json.load(open(root/'assets/catalog/hardware.json',encoding='utf-8'))
          games=cat['games']
          assert games, 'no games'
          ids=[g['id'] for g in games]
          assert len(ids)==len(set(ids)), 'duplicate game ids'
          total=0
          for g in games:
              assert g.get('name') and isinstance(g.get('vehicles'),list), f"bad game {g.get('id')}"
              seen=set()
              for v in g['vehicles']:
                  assert v.get('make') is not None and v.get('model'), f"bad vehicle in {g['id']}"
                  total+=1
          assert isinstance(schemas,dict) and schemas, 'no schemas'
          assert hw.get('manufacturers'), 'no hardware manufacturers'
          print(f'validated {len(games)} games / {total} vehicles / {len(hw["manufacturers"])} hardware manufacturers')
          PY

      - name: Verify source and assets
        run: |
          set -euxo pipefail
          test -s lib/main.dart
          test -s pubspec.yaml
          test -s assets/branding/drivervault_icon.png
          grep -q "DriverVault" lib/main.dart
          grep -q "shared_preferences" pubspec.yaml
          for f in assets/games/*.jpg; do test -s "$f"; done

      - name: Bundle mapped vehicle images
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, hashlib
          p=pathlib.Path('assets/catalog/catalog.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          out=pathlib.Path('assets/vehicles'); out.mkdir(parents=True,exist_ok=True)
          ok=fail=0
          image_map={}
          for g in data['games']:
            gd=out/g['id']; gd.mkdir(exist_ok=True)
            for v in g['vehicles']:
              url=str(v.get('image') or '').strip()
              if not url: continue
              ext='.png' if '.png' in url.lower() else '.jpg'
              name=hashlib.sha1(url.encode()).hexdigest()+ext
              dest=gd/name
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.fandom.com/'})
                with urllib.request.urlopen(req,timeout=20) as r: dest.write_bytes(r.read())
                if dest.stat().st_size<1000: raise ValueError('tiny image')
                image_map[url]=dest.as_posix()
                vid=str(v.get('id') or '').strip()
                if vid:
                  image_map[vid]=dest.as_posix()
                ok+=1
              except Exception as e:
                dest.unlink(missing_ok=True); fail+=1
          pathlib.Path('assets/catalog/vehicle_images.json').write_text(json.dumps(image_map,ensure_ascii=False,indent=2)+'\\n',encoding='utf-8')
          print('bundled vehicle images:',ok,'failed:',fail)
          if ok < 1500: raise SystemExit(f'Too few vehicle images bundled: {ok}')
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure platform scaffolding exists
        run: |
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            flutter create --project-name drivervault --platforms=android,ios .
          fi
          sed -i 's/android:label="drivervault"/android:label="DriverVault"/' android/app/src/main/AndroidManifest.xml
          test -s assets/branding/drivervault_icon.png
          dart run flutter_launcher_icons

      - name: Dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify release artifact
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk
          COUNT=$(unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -c 'assets/flutter_assets/assets/vehicles/')
          echo "Bundled vehicle files in APK: $COUNT"
          test "$COUNT" -ge 1500
          unzip -p build/app/outputs/flutter-apk/app-release.apk assets/flutter_assets/assets/catalog/vehicle_images.json | grep -q 'assets/vehicles/fh5/'
          python3 - <<'PY'
          import json, zipfile
          apk='build/app/outputs/flutter-apk/app-release.apk'
          with zipfile.ZipFile(apk) as z:
            cat=json.loads(z.read('assets/flutter_assets/assets/catalog/catalog.json'))
            mp=json.loads(z.read('assets/flutter_assets/assets/catalog/vehicle_images.json'))
            fh=next(g for g in cat['games'] if g['id']=='fh5')
            checked=0
            for v in fh['vehicles']:
              if not v.get('image'):
                continue
              vid=str(v.get('id') or '')
              assert vid in mp, f'missing FH5 ID mapping: {vid}'
              asset='assets/flutter_assets/'+mp[vid]
              assert asset in z.namelist(), f'missing APK asset: {asset}'
              checked+=1
            print('FH5 runtime ID mappings verified in APK:',checked)
            assert checked >= 800
          PY

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: DriverVault-release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
