name: DriverVault Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter platform files
        run: flutter create --project-name drivervault --platforms=android,ios .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DriverVault-v2.1-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: DriverVault-v2.1-source
          path: |
            lib/**
            assets/**
            pubspec.yaml
            analysis_options.yaml
            scripts/**
