name: DriverVault Android CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout real source
        uses: actions/checkout@v4

      - name: Verify DriverVault source before Flutter touches anything
        run: |
          set -euxo pipefail
          test -s lib/main.dart
          test -s pubspec.yaml
          test -s assets/catalog/catalog.json
          test -s assets/catalog/game_schemas.json
          test -s assets/catalog/hardware.json
          grep -q "DriverVault" lib/main.dart
          if grep -q "Flutter Demo Home Page" lib/main.dart; then
            echo "Flutter demo source detected - refusing build"
            exit 1
          fi

      - name: Validate JSON catalogues
        run: |
          python3 - <<'PY'
          import json
          for p in ['assets/catalog/catalog.json','assets/catalog/game_schemas.json','assets/catalog/hardware.json']:
              with open(p,encoding='utf-8') as f: json.load(f)
              print('valid:',p)
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create only missing platform scaffolding
        run: flutter create --project-name drivervault --platforms=android,ios .

      - name: Dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify release artifact
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: DriverVault-CI-APK
          path: build/app/outputs/flutter-apk/app-release.apk
