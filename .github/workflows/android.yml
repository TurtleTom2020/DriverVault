name: DriverVault Android CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate DriverVault data
        run: |
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('.')
          cat=json.load(open(root/'assets/catalog/catalog.json',encoding='utf-8'))
          schemas=json.load(open(root/'assets/catalog/game_schemas.json',encoding='utf-8'))
          hw=json.load(open(root/'assets/catalog/hardware.json',encoding='utf-8'))
          games=cat['games']
          assert games, 'no games'
          ids=[g['id'] for g in games]
          assert len(ids)==len(set(ids)), 'duplicate game ids'
          total=0
          for g in games:
              assert g.get('name') and isinstance(g.get('vehicles'),list), f"bad game {g.get('id')}"
              seen=set()
              for v in g['vehicles']:
                  assert v.get('make') is not None and v.get('model'), f"bad vehicle in {g['id']}"
                  k=(str(v.get('make','')).strip().lower(),str(v.get('model','')).strip().lower(),str(v.get('year','')),str(v.get('class','')).strip().lower())
                  assert k not in seen, f"duplicate vehicle {g['id']} {k}"
                  seen.add(k); total+=1
          assert isinstance(schemas,dict) and schemas, 'no schemas'
          assert hw.get('manufacturers'), 'no hardware manufacturers'
          print(f'validated {len(games)} games / {total} vehicles / {len(hw["manufacturers"])} hardware manufacturers')
          PY

      - name: Verify source and assets
        run: |
          set -euxo pipefail
          test -s lib/main.dart
          test -s pubspec.yaml
          test -s assets/branding/drivervault_icon.png
          grep -q "DriverVault" lib/main.dart
          grep -q "shared_preferences" pubspec.yaml
          for f in assets/games/*.jpg; do test -s "$f"; done

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Ensure platform scaffolding exists
        run: |
          if [ ! -f android/app/build.gradle.kts ] && [ ! -f android/app/build.gradle ]; then
            flutter create --project-name drivervault --platforms=android,ios .
          fi

      - name: Dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib

      - name: Static analysis
        run: flutter analyze lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Verify release artifact
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: DriverVault-release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
