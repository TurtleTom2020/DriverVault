name: Recover verified catalogue images

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - scripts/map_game_images.py
      - scripts/clean_bad_fh5_images.py
      - scripts/clean_bad_carx_images.py
      - .github/workflows/fh5-image-map.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove known false-positive FH5 mappings
        run: python3 scripts/clean_bad_fh5_images.py
      - name: Remove known false-positive CarX mappings
        run: python3 scripts/clean_bad_carx_images.py
      - name: Resolve and verify exact catalogue image URLs
        run: python3 scripts/map_game_images.py
      - name: Commit verified catalogue mappings
        run: |
          git config user.name "DriverVault Catalogue Bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/catalog/catalog.json
          if git diff --cached --quiet; then
            echo "No verified image changes"
          else
            git commit -m "Recover verified catalogue images"
            git push
          fi
